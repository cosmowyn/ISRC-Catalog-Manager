name: Help documentation refresh

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: help-docs-main
  cancel-in-progress: false

jobs:
  help-documentation:
    name: Publish validated Help screenshots
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        github.event.workflow_run.head_repository.id == github.event.repository.id &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Attest the CI producer and exact Help artifact
        id: artifact
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          run_inventory="$RUNNER_TEMP/help-source-run.json"
          artifact_inventory="$RUNNER_TEMP/help-source-artifacts.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$run_inventory"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
            > "$artifact_inventory"
          python3 scripts/trusted_ci_artifacts.py run \
            --artifacts "$artifact_inventory" \
            --run "$run_inventory" \
            --artifact-name help-documentation-pq \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$REPOSITORY_ID" \
            --default-branch "$DEFAULT_BRANCH" \
            --expected-run-id "$SOURCE_RUN_ID" \
            --expected-source-commit "$SOURCE_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Confirm the validated code is still current main
        if: ${{ steps.artifact.outputs.available == 'true' }}
        id: freshness
        env:
          SOURCE_SHA: ${{ steps.artifact.outputs.source_commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=2 origin main
          current_sha="$(git rev-parse origin/main)"
          if [[ "$SOURCE_SHA" == "$current_sha" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          parent_sha="$(git rev-parse "${current_sha}^" 2>/dev/null || true)"
          commit_subject="$(git log -1 --format=%s "$current_sha")"
          mapfile -d '' -t changed_paths < <(
            git diff --name-only --no-renames -z "$SOURCE_SHA" "$current_sha"
          )
          dashboard_only=true
          if [[ ${#changed_paths[@]} -eq 0 ]]; then
            dashboard_only=false
          fi
          for path in "${changed_paths[@]}"; do
            case "$path" in
              docs/validation/qa_pq_history.csv|docs/validation/coverage_snapshot.json) ;;
              *) dashboard_only=false ;;
            esac
          done

          if [[ "$parent_sha" == "$SOURCE_SHA" &&
                "$commit_subject" == "Update QA/PQ dashboard data [skip ci]" &&
                "$dashboard_only" == true ]]; then
            git switch --detach "$current_sha"
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "Main advanced only by this CI run's dashboard publication; applying validated screenshots on top."
            exit 0
          fi

          echo "current=false" >> "$GITHUB_OUTPUT"
          echo "Main advanced with code or unrelated data after validation; a newer CI run must publish its screenshots."

      - name: Download validated Help output
        if: ${{ steps.freshness.outputs.current == 'true' }}
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.artifact.outputs.artifact_id }}
          digest-mismatch: error
          path: ${{ runner.temp }}/help-documentation-pq
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Apply refreshed screenshots
        if: ${{ steps.freshness.outputs.current == 'true' }}
        env:
          SOURCE_SHA: ${{ steps.artifact.outputs.source_commit }}
        run: |
          python3 scripts/apply_help_screenshots.py \
            --artifact-root "$RUNNER_TEMP/help-documentation-pq" \
            --repository-root . \
            --destination docs/help/screenshots \
            --expected-source-commit "$SOURCE_SHA"

      - name: Commit changed screenshots on main
        if: ${{ steps.freshness.outputs.current == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_AUTOMATION_DEPLOY_KEY: ${{ secrets.MAIN_AUTOMATION_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/help/screenshots; then
            echo "Validated Help screenshots are unchanged."
            exit 0
          fi
          if [ -z "${MAIN_AUTOMATION_DEPLOY_KEY:-}" ]; then
            echo "MAIN_AUTOMATION_DEPLOY_KEY is required to publish refreshed Help screenshots." >&2
            exit 1
          fi

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main advanced after validation; the newer CI run will publish its screenshots."
            exit 0
          fi

          key_file="$RUNNER_TEMP/main_automation_deploy_key"
          known_hosts="$RUNNER_TEMP/github_known_hosts"
          trap 'rm -f "$key_file" "$known_hosts"' EXIT
          printf '%s\n' "$MAIN_AUTOMATION_DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          gh api /meta --jq '.ssh_keys[] | "github.com " + .' > "$known_hosts"
          test -s "$known_hosts"
          git remote set-url origin "git@github.com:${{ github.repository }}.git"
          git config core.sshCommand "ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/help/screenshots
          git -c core.hooksPath=/dev/null commit -m "Refresh validated Help screenshots [skip ci]"
          git push origin HEAD:main
