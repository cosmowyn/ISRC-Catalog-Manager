name: Cleanup obsolete build downloads

on:
  schedule:
    - cron: "17 03 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: Cleanup mode
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

permissions: {}

concurrency:
  group: cleanup-obsolete-build-downloads
  cancel-in-progress: false

jobs:
  plan:
    name: Plan obsolete build cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      deployments: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.4"

      - name: Run read-only cleanup plan
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/cleanup_github_builds.py \
            --repository "$GITHUB_REPOSITORY" \
            --repository-root "$GITHUB_WORKSPACE" \
            --audit-log "$RUNNER_TEMP/github-build-cleanup-plan.jsonl"

      - name: Reject apply from a non-default branch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' }}
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Apply is permitted only from refs/heads/$DEFAULT_BRANCH; got $GITHUB_REF." >&2
            exit 1
          fi

      - name: Upload cleanup plan audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: github-build-cleanup-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/github-build-cleanup-plan.jsonl
          if-no-files-found: error
          retention-days: 30

  apply:
    name: Apply obsolete build cleanup
    needs: plan
    if: >-
      ${{ needs.plan.result == 'success' &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' &&
            inputs.mode == 'apply' &&
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
      deployments: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.4"

      - name: Apply conservative cleanup
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          current_default_sha="$(
            gh api "/repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha
          )"
          if [[ "$checked_out_sha" != "$GITHUB_SHA" || "$current_default_sha" != "$GITHUB_SHA" ]]; then
            echo "Default branch advanced after this cleanup run started; refusing stale public-link analysis." >&2
            exit 1
          fi
          python scripts/cleanup_github_builds.py \
            --repository "$GITHUB_REPOSITORY" \
            --repository-root "$GITHUB_WORKSPACE" \
            --expected-default-sha "$GITHUB_SHA" \
            --audit-log "$RUNNER_TEMP/github-build-cleanup-apply.jsonl" \
            --apply

      - name: Upload cleanup apply audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: github-build-cleanup-apply-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/github-build-cleanup-apply.jsonl
          if-no-files-found: error
          retention-days: 30
